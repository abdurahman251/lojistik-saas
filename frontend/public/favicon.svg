<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Canlı & Zengin Kurumsal Lojistik Mavisi Degrade -->
    <linearGradient id="losBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <!-- Canlı Düz Zemin: Köşeleri Hafif Yuvarlatılmış Modern Kare (Squircle) -->
  <rect x="2" y="2" width="124" height="124" rx="28" fill="url(#losBg)"/>

  <!-- İnce İç Kontur -->
  <rect x="4" y="4" width="120" height="120" rx="26" fill="none" stroke="#93c5fd" stroke-width="3" stroke-opacity="0.6"/>

  <!-- LOS Metni -->
  <text x="64" y="82" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
        font-size="52" 
        font-weight="900" 
        letter-spacing="1px" 
        text-anchor="middle" 
        fill="#ffffff">LOS</text>
</svg>
